name: Deploy paper to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare site
        shell: bash
        run: |
          set -e
          rm -rf _site
          mkdir -p _site

          cp -R work _site/work

          cat > _site/index.html <<'EOF'
          <!doctype html>
          <html>
            <head>
              <meta http-equiv="refresh" content="0; url=work/docs/">
              <link rel="canonical" href="work/docs/">
              <title>CTR Opportunity Scoring</title>
            </head>
            <body>
              <p>
                Redirecting to
                <a href="work/docs/">CTR Opportunity Scoring</a>...
              </p>
            </body>
          </html>
          EOF

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4